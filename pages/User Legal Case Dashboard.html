<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার Legal Cases — SafeVoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        .status-bar { display: flex; gap: 0; margin: 20px 0; }
        .status-step { flex: 1; text-align: center; padding: 8px 4px; font-size: 11px; background: #0f172a; border: 1px solid #334155; }
        .status-step.active { background: #6366f1; border-color: #6366f1; }
        .status-step.done   { background: #064e3b; border-color: #10b981; color: #6ee7b7; }
        .status-step:first-child { border-radius: 8px 0 0 8px; }
        .status-step:last-child  { border-radius: 0 8px 8px 0; }
        .chat-box { height: 300px; overflow-y: auto; background: #0f172a; border-radius: 10px; padding: 16px; }
        .msg-user   { background: #6366f1; border-radius: 12px 12px 2px 12px; padding: 10px 14px; max-width: 70%; margin-left: auto; margin-bottom: 8px; font-size: 13px; }
        .msg-lawyer { background: #1e293b; border: 1px solid #334155; border-radius: 12px 12px 12px 2px; padding: 10px 14px; max-width: 70%; margin-bottom: 8px; font-size: 13px; }
        .form-control { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; border-radius: 8px; }
        .form-control:focus { background: #0f172a; border-color: #6366f1; color: #e2e8f0; box-shadow: none; }
        .btn-primary { background: #6366f1; border: none; border-radius: 8px; }
        .offer-card { background: #0f172a; border: 1px solid #6366f1; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
        .timer-bar { background: #7f1d1d; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #fca5a5; }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold">⚖️ আমার Legal Cases</h4>
        <a href="/legal-help" class="btn btn-primary btn-sm">+ নতুন Case</a>
    </div>

    <div id="cases-list"><div class="text-secondary">Loading...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const statusSteps = ['pending','offer_received','lawyer_booked','in_progress','waiting_payment','resolved'];
    const statusLabels = { pending:'Lawyer খোঁজা হচ্ছে', offer_received:'Offer পেয়েছো', lawyer_booked:'Lawyer Booked', in_progress:'Case চলছে', waiting_payment:'Payment বাকি', resolved:'Resolved' };

    async function loadCases() {
        const res = await fetch('/api/legal/cases/my', { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
        const data = await res.json();
        const el = document.getElementById('cases-list');

        if (!data.success) {
            el.innerHTML = '<div class="text-danger">Login করুন।</div>';
            return;
        }
        if (!data.cases.length) {
            el.innerHTML = '<div class="text-secondary">কোনো case নেই।</div>';
            return;
        }

        el.innerHTML = data.cases.map(c => `
            <div class="card p-4 mb-4">
                <div class="d-flex justify-content-between mb-2">
                    <strong>${c.case_id}</strong>
                    <span style="color:#6366f1">${c.status_label}</span>
                </div>

                <!-- Status Bar -->
                <div class="status-bar">
                    ${statusSteps.map(s => `
                        <div class="status-step ${s === c.status ? 'active' : statusSteps.indexOf(s) < statusSteps.indexOf(c.status) ? 'done' : ''}">
                            ${statusLabels[s] || s}
                        </div>
                    `).join('')}
                </div>

                ${c.lawyer ? `
                <div class="card p-3 mb-3" style="background:#0f172a">
                    <div class="fw-semibold mb-1" style="color:#6366f1">⚖️ আপনার Lawyer</div>
                    <div>👤 ${c.lawyer.name}</div>
                    <div>📞 ${c.lawyer.phone}</div>
                    <div>✉️ ${c.lawyer.email}</div>
                    <div>🎓 ${c.lawyer.specialization || '—'}</div>
                    <div>⭐ ${c.lawyer.rating}/5</div>
                </div>` : ''}

                ${c.pending_offers && c.pending_offers.length > 0 ? `
                <div class="mb-3">
                    <div class="fw-semibold mb-2">📬 Pending Offers</div>
                    ${c.pending_offers.map(o => `
                        <div class="offer-card">
                            <div>${o.type === 'counter' ? Counter Offer: ৳${o.counter_price} : 'Accept করতে চান (আপনার budget এ)'}</div>
                            ${o.message ? <div class="text-secondary mt-1">${o.message}</div> : ''}
                            <div class="mt-2 d-flex gap-2">
                                <button class="btn btn-sm" style="background:#059669;color:white;border-radius:6px" onclick="respondOffer(${o.id},'accept')">✅ Accept</button>
                                <button class="btn btn-sm" style="background:#dc2626;color:white;border-radius:6px" onclick="respondOffer(${o.id},'reject')">❌ Reject</button>
                            </div>
                        </div>
                    `).join('')}
                </div>` : ''}

                ${c.status === 'offer_received' ? `
                <div class="mb-3">
                    <button class="btn btn-primary btn-sm" onclick="pay30(${c.id}, ${c.agreed_price})">
                        💳 ৩০% Payment করুন (৳${Math.round(c.agreed_price * 0.3)}) — Lawyer Book করুন
                    </button>
                </div>` : ''}

                ${c.status === 'waiting_payment' ? `
                <div class="timer-bar mb-3">
                    ⚠️ Payment Deadline: ${new Date(c.payment_deadline).toLocaleDateString('bn-BD')} এর মধ্যে বাকি ৭০% দিন
                    <button class="btn btn-sm ms-3" style="background:#b91c1c;color:white;border-radius:6px" onclick="pay70(${c.id}, ${c.agreed_price})">
                        💳 ৭০% দিন (৳${Math.round(c.agreed_price * 0.7)})
                    </button>
                    <button class="btn btn-sm ms-2" style="background:#374151;color:white;border-radius:6px" onclick="disputeCase(${c.id})">
                        🚨 Admin কে Complaint করুন
                    </button>
                </div>` : ''}

                ${['lawyer_booked','in_progress','waiting_payment'].includes(c.status) ? `
                <div class="mt-3">
                    <div class="fw-semibold mb-2">💬 Chat</div>
                    <div class="chat-box mb-2" id="chat-${c.id}"></div>
                    <div class="d-flex gap-2">
                        <input class="form-control" id="msg-${c.id}" placeholder="Message...">
                        <button class="btn btn-primary px-3" onclick="sendMsg(${c.id})">Send</button>
                    </div>
                </div>` : ''}
            </div>
        `).join('');

        // Load messages for active cases
        data.cases.filter(c => ['lawyer_booked','in_progress','waiting_payment'].includes(c.status))
                  .forEach(c => loadMessages(c.id));
    }

    async function loadMessages(caseId) {
        const res = await fetch(/api/legal/cases/${caseId}/messages, { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
        const data = await res.json();
        const box = document.getElementById(chat-${caseId});
        if (!box || !data.messages) return;

        box.innerHTML = data.messages.map(m => `
            <div class="${m.sender_type === 'user' ? 'msg-user' : 'msg-lawyer'}">
                ${m.message}
                <div style="font-size:10px;opacity:0.6;margin-top:3px">${new Date(m.created_at).toLocaleTimeString()}</div>
            </div>
        `).join('');
        box.scrollTop = box.scrollHeight;
    }

    async function sendMsg(caseId) {
        const input = document.getElementById(msg-${caseId});
        if (!input.value.trim()) return;
        await fetch(/api/legal/cases/${caseId}/message, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
            body: JSON.stringify({ message: input.value })
        });
        input.value = '';
        loadMessages(caseId);
    }

    async function respondOffer(offerId, action) {
        const res = await fetch(/api/legal/cases/offers/${offerId}/respond, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
            body: JSON.stringify({ action })
        });
        const data = await res.json();
        alert(data.message);
        if (data.success) loadCases();
    }

    async function pay30(caseId, price) {
        const txn = prompt(৳${Math.round(price * 0.3)} payment করুন। Transaction ID দিন:);
        if (!txn) return;
        const res = await fetch(/api/legal/cases/${caseId}/pay-30, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
            body: JSON.stringify({ transaction_id: txn })
        });
        const data = await res.json();
        alert(data.message);
        if (data.success) loadCases();
    }

    async function pay70(caseId, price) {
        const txn = prompt(৳${Math.round(price * 0.7)} payment করুন। Transaction ID দিন:);
        if (!txn) return;
        const res = await fetch(/api/legal/cases/${caseId}/pay-70, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
            body: JSON.stringify({ transaction_id: txn })
        });
        const data = await res.json();
        alert(data.message);
        if (data.success) loadCases();
    }

    async function disputeCase(caseId) {
        const reason = prompt('Complaint এর কারণ লিখুন (বিস্তারিত):');
        if (!reason || reason.length < 20) { alert('কমপক্ষে ২০ অক্ষর লিখুন।'); return; }
        const res = await fetch(/api/legal/cases/${caseId}/dispute, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
            body: JSON.stringify({ reason })
        });
        const data = await res.json();
        alert(data.message);
        if (data.success) loadCases();
    }

    loadCases();
    setInterval(loadCases, 10000);
</script>
</body>
</html>
