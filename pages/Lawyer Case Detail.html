
 <!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Detail — SafeVoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        .chat-box { height: 400px; overflow-y: auto; background: #0f172a; border-radius: 10px; padding: 16px; }
        .msg-user   { background: #6366f1; border-radius: 12px 12px 2px 12px; padding: 10px 14px; max-width: 70%; margin-left: auto; margin-bottom: 8px; }
        .msg-lawyer { background: #1e293b; border: 1px solid #334155; border-radius: 12px 12px 12px 2px; padding: 10px 14px; max-width: 70%; margin-bottom: 8px; }
        .form-control { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; }
        .form-control:focus { background: #0f172a; border-color: #6366f1; color: #e2e8f0; box-shadow: none; }
        .btn-send { background: #6366f1; border: none; color: white; border-radius: 8px; }
    </style>
</head>
<body>
<div class="container py-4">
    <a href="/lawyer/dashboard" class="btn btn-outline-secondary btn-sm mb-3">← Dashboard</a>

    <div id="case-info" class="card p-4 mb-4">
        <div class="text-secondary">Loading...</div>
    </div>

    <div class="card p-4">
        <h6 class="fw-semibold mb-3">💬 User এর সাথে কথা বলুন</h6>
        <div class="chat-box mb-3" id="chat-box"></div>
        <div class="d-flex gap-2">
            <input type="text" class="form-control" id="msg-input" placeholder="Message লিখুন...">
            <button class="btn-send px-3" onclick="sendMsg()">Send</button>
        </div>
    </div>
</div>

<script>
    const caseId = window.location.pathname.split('/').pop();
    const lawyer = JSON.parse(localStorage.getItem('lawyer') || '{}');
    if (!lawyer.id) window.location.href = '/lawyer/login';

    async function loadCase() {
        const res = await fetch('/api/lawyer/cases/my', { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
        const data = await res.json();
        const c = data.cases?.find(x => x.id == caseId);
        if (!c) return;

        document.getElementById('case-info').innerHTML = `
            <div class="d-flex justify-content-between">
                <h5 class="fw-bold">${c.case_id}</h5>
                <span>${c.status_label}</span>
            </div>
            <div class="mt-2 text-secondary">Issue: ${c.issue_type}</div>
            <div class="text-secondary">Agreed Price: ৳${c.agreed_price}</div>
            <div class="text-secondary">Client: ${c.user_name} — ${c.user_phone}</div>
        `;
    }

    async function loadMessages() {
        const res = await fetch(/api/legal/cases/${caseId}/messages, { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
        const data = await res.json();
        const box = document.getElementById('chat-box');
        if (!data.messages) return;

        box.innerHTML = data.messages.map(m => `
            <div class="${m.sender_type === 'lawyer' ? 'msg-lawyer' : 'msg-user'}">
                <div style="font-size:13px">${m.message}</div>
                <div style="font-size:11px;opacity:0.6;margin-top:4px">${new Date(m.created_at).toLocaleTimeString('bn-BD')}</div>
            </div>
        `).join('');
        box.scrollTop = box.scrollHeight;
    }

    async function sendMsg() {
        const input = document.getElementById('msg-input');
        if (!input.value.trim()) return;

        await fetch(/api/lawyer/cases/${caseId}/message, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
            body: JSON.stringify({ message: input.value })
        });
        input.value = '';
        loadMessages();
    }

    document.getElementById('msg-input').addEventListener('keypress', e => {
        if (e.key === 'Enter') sendMsg();
    });

    loadCase();
    loadMessages();
    setInterval(loadMessages, 5000); // 5 sec poll
</script>
</body>
</html>
