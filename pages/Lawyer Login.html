<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lawyer Login — SafeVoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; }
        .form-control { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; border-radius: 8px; }
        .form-control:focus { background: #0f172a; border-color: #6366f1; color: #e2e8f0; box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }
        .btn-primary { background: #6366f1; border: none; border-radius: 8px; }
        .btn-primary:hover { background: #4f46e5; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <h2 class="fw-bold" style="color:#6366f1">⚖️ SafeVoice</h2>
                <p class="text-secondary">Lawyer Portal</p>
            </div>
            <div class="card p-4">
                <h5 class="fw-semibold mb-4">Login</h5>
                <div id="alert-box" class="alert d-none"></div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="your@email.com">
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••">
                </div>
                <button class="btn btn-primary w-100 py-2" onclick="doLogin()">Login করুন</button>
            </div>
            <p class="text-center mt-3 text-secondary">
                Account নেই? <a href="/lawyer/register" style="color:#6366f1">Register করুন</a>
            </p>
        </div>
    </div>
</div>

<script>
    async function doLogin() {
        const btn = event.target;
        btn.disabled = true;
        btn.textContent = 'Login হচ্ছে...';

        const res = await fetch('/api/lawyer/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
            body: JSON.stringify({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
            })
        });
        const data = await res.json();

        if (data.success) {
            localStorage.setItem('lawyer', JSON.stringify(data.lawyer));
            window.location.href = '/lawyer/dashboard';
        } else {
            const box = document.getElementById('alert-box');
            box.className = 'alert alert-danger';
            box.textContent = data.message;
            box.classList.remove('d-none');
            btn.disabled = false;
            btn.textContent = 'Login করুন';
        }
    }
</script>
</body>
</html>
